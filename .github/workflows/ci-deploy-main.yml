name: CI & Auto-Deploy Main (Cloudflare Workers)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    name: Kiểm thử & Build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            FE/package-lock.json

      - name: Cài dependencies (Root & FE)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix FE ci --no-audit --no-fund

      - name: Kiểm tra cú pháp JS (src/ & public/)
        run: |
          find src public -maxdepth 3 -name "*.js" -not -path "public/app/*" -print0 | xargs -0 -n 1 node --check

      - name: Chạy Unit Tests (Worker & UI)
        run: npm test

      - name: Chạy Unit Tests (FE)
        run: npm --prefix FE test

      - name: Build màn hình Dòng tiền (FE -> public/app/)
        env:
          FORCE_FE_BUILD: "1"
          STRICT_FE_BUILD: "1"
        run: node scripts/build-fe.mjs

      - name: Lưu tạm bản build public/app cho bước deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: public/app
          retention-days: 1

  deploy:
    name: Deploy Cloudflare Workers (ctgwarroom)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ctgwarroom.cthomes-warroom.workers.dev/kpi
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cài dependencies (Root)
        run: npm ci --no-audit --no-fund

      - name: Tải bản build public/app
        uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: public/app

      - name: Cập nhật mốc thời gian bản build FE
        run: touch public/app/index.html

      - name: Kiểm tra cấu hình CLOUDFLARE_API_TOKEN
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Chưa thiết lập GitHub Secret CLOUDFLARE_API_TOKEN. Vào Settings > Secrets and variables > Actions để thêm token Cloudflare (quyền Edit Cloudflare Workers)."
            exit 1
          fi

      - name: Deploy lên Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '0b4396c3cde27e1e42e4bfbeab49490d' }}
          STRICT_FE_BUILD: "1"
        run: npm run deploy

      - name: Kiểm tra phản hồi sau deploy (Smoke Check)
        run: |
          CODE=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" https://ctgwarroom.cthomes-warroom.workers.dev/kpi)
          echo "LIVE_HTTP_STATUS=$CODE"
          if [ "$CODE" != "401" ] && [ "$CODE" != "200" ]; then
            echo "::error::Deploy xong nhưng endpoint /kpi trả HTTP $CODE bất thường."
            exit 1
          fi
