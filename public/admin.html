<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản trị – Tài khoản &amp; Nhật ký | WAR ROOM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <style>
    /* War Room v5 "Night Ops" (docs/STYLE_GUIDE.md): cùng token với trang Dòng tiền / KPI / War Room.
       Lime (--accent) chỉ cho trạng thái giao diện (đang chọn, bây giờ, điều hướng); màu trạng thái có nghĩa cố định. */
    :root {
      color-scheme: dark;
      --bg: #07090d; --surface: #0e1218; --surface-subtle: #151a23; --surface-hover: #1b222d;
      --border: #1c232e; --border-strong: #2a3442;
      --navy-950: #0a0d12; --navy-800: #151a23; --navy-700: #1b222d; --navy-100: color-mix(in srgb, #3da9fc 14%, #0e1218);
      --text-primary: #f3f6fa; --text-secondary: #b6c0ce; --text-muted: #8994a6;
      --accent: #c8ff4d; --on-accent: #0a0d12; --info: #3da9fc;
      --success: #2ee6a6; --success-bg: color-mix(in srgb, #2ee6a6 16%, transparent); --success-border: color-mix(in srgb, #2ee6a6 60%, transparent);
      --warning: #ffb020; --warning-bg: color-mix(in srgb, #ffb020 16%, transparent); --warning-border: color-mix(in srgb, #ffb020 60%, transparent);
      --danger: #ff4d6d; --danger-bg: color-mix(in srgb, #ff4d6d 16%, transparent); --danger-border: color-mix(in srgb, #ff4d6d 60%, transparent);
      --font-sans: 'Be Vietnam Pro', 'Segoe UI', Roboto, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.5; color: var(--text-primary); background: var(--bg); }
    body { background-image: radial-gradient(circle at 0% 0%, rgba(200, 255, 77, 0.05), transparent 40%); background-attachment: fixed; -webkit-font-smoothing: antialiased; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); color: var(--text-primary); }
    .topbar-inner, main { max-width: 1240px; margin: 0 auto; padding: 12px 20px; }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .brand-title { font-weight: 800; font-size: 16px; letter-spacing: .03em; text-transform: uppercase; }
    .brand-sub { font-size: 12px; color: var(--text-muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font: 600 12.5px var(--font-sans); cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); text-decoration: none; white-space: nowrap; }
    .btn:hover { background: var(--surface-hover); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
    .btn-ghost-top { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--text-primary); }
    .btn-ghost-top:hover { background: var(--surface-hover); }
    .btn-danger { color: var(--danger); border-color: var(--danger-border); }
    .btn-danger:hover { background: var(--danger-bg); }
    main { padding-top: 18px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .panel-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .panel-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--text-primary); }
    .panel-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
    .input { font: 13px var(--font-sans); padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 8px; min-width: 220px; background: var(--surface-subtle); color: var(--text-primary); }
    .input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .notice { margin: 12px 16px 0; padding: 9px 12px; border-radius: 8px; background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); font-size: 13px; }
    .online { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; font-size: 13px; }
    .err-banner { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--surface-subtle); color: var(--text-muted); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; position: sticky; top: 0; }
    tbody tr:hover { background: var(--surface-hover); }
    td.nowrap { white-space: nowrap; }
    .uname { color: var(--accent); cursor: pointer; font-weight: 700; background: none; border: 0; padding: 0; font: 700 13px var(--font-mono); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; border: 1px solid; }
    .pill.ok { color: var(--success); background: var(--success-bg); border-color: var(--success-border); }
    .pill.warn { color: var(--warning); background: var(--warning-bg); border-color: var(--warning-border); }
    .pill.bad { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-border); }
    .pill.info { color: var(--info); background: var(--navy-100); border-color: color-mix(in srgb, var(--info) 60%, transparent); }
    .logs-wrap { max-height: 560px; overflow: auto; }
    .muted { color: var(--text-muted); }
    .toast { border: 1px solid var(--border-strong); position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface-subtle); color: var(--text-primary); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 100; display: none; }
    @media (max-width: 760px) {
      .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
      .input { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">🛡️ QUẢN TRỊ — TÀI KHOẢN &amp; NHẬT KÝ</div>
        <div class="brand-sub">Tài khoản mới / vừa reset dùng mật khẩu mặc định CTG@2026 và bắt buộc đổi ở lần đăng nhập đầu</div>
      </div>
    </div>
  </header>

  <main>
    <div id="errBanner" class="err-banner" hidden></div>
    <div id="onlineBox" class="online" hidden></div>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Tài khoản <span id="userCount" class="panel-sub"></span></h2>
        <div class="row">
          <input id="userSearch" class="input" type="search" placeholder="Tìm tên, tên đăng nhập, phòng ban…" />
          <button id="syncBtn" class="btn btn-primary" type="button" title="Tạo tài khoản cho người có trong dữ liệu dashboard (nạp từ file Excel) mà chưa có tài khoản">Đồng bộ user từ dữ liệu Excel</button>
        </div>
      </div>
      <div id="syncResult" class="notice" hidden></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Chức danh</th><th>Phòng ban</th><th>Mật khẩu</th><th>Đăng nhập gần nhất</th><th></th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="logsPanel">
      <div class="panel-head">
        <h2 class="panel-title">Nhật ký thao tác <span class="panel-sub">500 dòng mới nhất</span></h2>
        <div class="row">
          <input id="logUser" class="input" type="search" placeholder="Lọc theo tên đăng nhập (VD: vdhhoang)" />
          <button id="logReload" class="btn" type="button">Tải lại</button>
        </div>
      </div>
      <div class="table-wrap logs-wrap">
        <table>
          <thead><tr><th>Thời gian</th><th>Người dùng</th><th>Thao tác</th><th>Chi tiết</th><th>IP</th></tr></thead>
          <tbody id="logsBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>

  <script>
  (() => {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const norm = (s) => String(s || "").toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[̀-ͯ]/g, "");
    // Giờ Việt Nam, dạng dd/mm/yyyy hh:mm
    const fmt = (iso) => {
      if (!iso) return "—";
      const s = new Date(Date.parse(iso) + 7 * 3600e3).toISOString();
      return `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)} ${s.slice(11, 16)}`;
    };
    const ACTIONS = {
      login: ["Đăng nhập", "ok"], login_failed: ["Đăng nhập sai", "bad"], login_locked: ["Bị tạm khóa", "bad"], logout: ["Đăng xuất", "info"],
      password_changed: ["Đổi mật khẩu", "ok"], password_change_failed: ["Đổi mật khẩu lỗi", "warn"], password_reset: ["Reset mật khẩu", "warn"],
      users_synced: ["Đồng bộ user", "info"], booking_created: ["Hẹn lịch BOD", "ok"], booking_blocked: ["Chặn lịch (BOD bận)", "warn"],
      booking_cancelled: ["Hủy lịch", "warn"], view: ["Xem trang", "info"],
    };
    let users = [];

    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.style.display = "block";
      clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 2800);
    }

    async function api(method, path, body) {
      const res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
      if (res.status === 401) { location.reload(); throw new Error("Phiên đăng nhập đã hết hạn."); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
      return data;
    }

    function showError(e) { $("errBanner").textContent = e.message; $("errBanner").hidden = false; }

    async function loadUsers() {
      try { users = (await api("GET", "/api/admin/users")).users; renderUsers(); } catch (e) { showError(e); }
    }

    function renderUsers() {
      const q = norm($("userSearch").value.trim());
      const rows = users.filter((u) => !q || norm(`${u.username} ${u.full_name} ${u.title} ${u.department}`).includes(q));
      const pending = users.filter((u) => u.must_change).length;
      $("userCount").textContent = `${users.length} tài khoản · ${pending} chưa đổi mật khẩu`;
      $("usersBody").innerHTML = rows.length ? rows.map((u) => `<tr>
        <td class="nowrap"><button class="uname" type="button" data-logs="${esc(u.username)}" title="Xem nhật ký của người này">${esc(u.username)}</button></td>
        <td class="nowrap"><b>${esc(u.full_name)}</b></td>
        <td>${esc(u.title) || '<span class="muted">—</span>'}</td>
        <td>${esc(u.department) || '<span class="muted">—</span>'}</td>
        <td>${u.must_change ? '<span class="pill warn">Chưa đổi</span>' : '<span class="pill ok">Đã đổi</span>'}</td>
        <td class="nowrap mono">${fmt(u.last_login_at)}</td>
        <td><button class="btn btn-danger" type="button" data-reset="${esc(u.username)}">Reset MK</button></td>
      </tr>`).join("") : `<tr><td colspan="7" class="muted">${users.length ? "Không có kết quả." : "Chưa có tài khoản. Bấm “Đồng bộ user từ dữ liệu Excel”."}</td></tr>`;
    }

    async function loadLogs() {
      const u = $("logUser").value.trim().toLowerCase();
      try {
        const { logs } = await api("GET", "/api/admin/logs" + (u ? `?user=${encodeURIComponent(u)}` : ""));
        $("logsBody").innerHTML = logs.length ? logs.map((l) => {
          const [label, tone] = ACTIONS[l.action] || [l.action, "info"];
          return `<tr><td class="nowrap mono">${fmt(l.ts)}</td><td class="nowrap mono">${esc(l.username) || "—"}</td><td><span class="pill ${tone}">${esc(label)}</span></td><td>${esc(l.detail)}</td><td class="nowrap mono muted">${esc(l.ip)}</td></tr>`;
        }).join("") : '<tr><td colspan="5" class="muted">Chưa có nhật ký.</td></tr>';
      } catch (e) { showError(e); }
    }

    async function sync() {
      const btn = $("syncBtn"); btn.disabled = true;
      try {
        const r = await api("POST", "/api/admin/users/sync");
        const box = $("syncResult");
        box.textContent = r.created.length
          ? `Đã tạo ${r.created.length} tài khoản mới (mật khẩu CTG@2026): ${r.created.map((c) => `${c.fullName} → ${c.username}`).join(" · ")}`
          : `Không có người mới. Tổng cộng ${r.total} tài khoản.`;
        box.hidden = false;
        await Promise.all([loadUsers(), loadLogs()]);
      } catch (e) { showError(e); }
      btn.disabled = false;
    }

    async function reset(username) {
      const u = users.find((x) => x.username === username);
      if (!u || !confirm(`Reset mật khẩu của ${u.full_name} (${u.username}) về CTG@2026?\nNgười này sẽ bị đăng xuất và phải đổi mật khẩu khi đăng nhập lại.`)) return;
      try { await api("POST", "/api/admin/users/reset", { username }); toast(`Đã reset mật khẩu ${username}`); await Promise.all([loadUsers(), loadLogs()]); }
      catch (e) { showError(e); }
    }

    document.addEventListener("click", (e) => {
      const r = e.target.closest("[data-reset]");
      if (r) { reset(r.dataset.reset); return; }
      const l = e.target.closest("[data-logs]");
      if (l) { $("logUser").value = l.dataset.logs; loadLogs(); $("logsPanel").scrollIntoView({ behavior: "smooth" }); }
    });
    $("userSearch").addEventListener("input", renderUsers);
    $("syncBtn").onclick = sync;
    $("logReload").onclick = loadLogs;
    $("logUser").addEventListener("keydown", (e) => { if (e.key === "Enter") loadLogs(); });
    $("logUser").addEventListener("search", loadLogs);

    // Ai đang mở web: server đẩy danh sách qua WebSocket (src/live.js); mất kết nối thì thử lại.
    let wsDelay = 1000;
    function connect() {
      const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/live/ws");
      const ping = setInterval(() => ws.readyState === WebSocket.OPEN && ws.send("ping"), 30000);
      ws.onopen = () => { wsDelay = 1000; };
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; } // "pong"
        if (m.type !== "presence") return;
        const list = m.online || [];
        $("onlineBox").innerHTML = `🟢 <b>Đang online (${list.length})</b>: ${list.map((p) => `${esc(p.fullName || p.name || p.username)} <span class="muted mono">(${esc(p.username)})</span>`).join(", ") || '<span class="muted">không có ai</span>'}`;
        $("onlineBox").hidden = false;
      };
      ws.onclose = () => { clearInterval(ping); setTimeout(connect, wsDelay); wsDelay = Math.min(wsDelay * 2, 30000); };
    }

    loadUsers();
    loadLogs();
    connect();
  })();
  </script>
</body>
</html>
