<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hẹn lịch BOD | WAR ROOM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <style>
    /* War Room v5 "Night Ops" (docs/STYLE_GUIDE.md): cùng token với trang Dòng tiền / KPI / War Room.
       Lime (--accent) chỉ cho trạng thái giao diện (đang chọn, bây giờ, điều hướng); màu trạng thái có nghĩa cố định. */
    :root {
      color-scheme: dark;
      --bg: #07090d; --surface: #0e1218; --surface-subtle: #151a23; --surface-hover: #1b222d;
      --border: #1c232e; --border-strong: #2a3442;
      --navy-950: #0a0d12; --navy-800: #151a23; --navy-700: #1b222d; --navy-100: color-mix(in srgb, #3da9fc 14%, #0e1218);
      --text-primary: #f3f6fa; --text-secondary: #b6c0ce; --text-muted: #8994a6;
      --accent: #c8ff4d; --on-accent: #0a0d12; --info: #3da9fc;
      --success: #2ee6a6; --success-bg: color-mix(in srgb, #2ee6a6 16%, transparent); --success-border: color-mix(in srgb, #2ee6a6 60%, transparent);
      --warning: #ffb020; --warning-bg: color-mix(in srgb, #ffb020 16%, transparent); --warning-border: color-mix(in srgb, #ffb020 60%, transparent);
      --danger: #ff4d6d; --danger-bg: color-mix(in srgb, #ff4d6d 16%, transparent); --danger-border: color-mix(in srgb, #ff4d6d 60%, transparent);
      --font-sans: 'Be Vietnam Pro', 'Segoe UI', Roboto, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.5; color: var(--text-primary); background: var(--bg); }
    body { background-image: radial-gradient(circle at 0% 0%, rgba(200, 255, 77, 0.05), transparent 40%); background-attachment: fixed; -webkit-font-smoothing: antialiased; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); color: var(--text-primary); position: sticky; top: 0; z-index: 40; }
    .topbar-inner, main { max-width: 1240px; margin: 0 auto; padding: 12px 20px; }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .brand-title { font-weight: 800; font-size: 16px; letter-spacing: .03em; text-transform: uppercase; }
    .brand-sub { font-size: 12px; color: var(--text-muted); }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font: 600 12.5px var(--font-sans); cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); text-decoration: none; white-space: nowrap; }
    .btn:hover { background: var(--surface-hover); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
    .btn-ghost-top { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--text-primary); }
    .btn-ghost-top:hover { background: var(--surface-hover); }
    .btn-danger { color: var(--danger); border-color: var(--danger-border); }
    .btn-danger:hover { background: var(--danger-bg); }
    main { padding-top: 18px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 16px; }

    .now-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .now-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--text-muted); }
    .now-dot.free { background: var(--success); box-shadow: 0 0 0 5px var(--success-bg); }
    .now-dot.busy { background: var(--danger); box-shadow: 0 0 0 5px var(--danger-bg); }
    .now-main { flex: 1; min-width: 240px; }
    .now-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
    .now-text { font-size: 17px; font-weight: 600; }
    .err-banner { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); border-radius: 10px; padding: 10px 14px; font-weight: 600; }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .day-chip { flex: none; min-width: 92px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-family: inherit; color: var(--text-primary); }
    .day-chip:hover { border-color: var(--border-strong); }
    .day-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .day-chip b { display: block; font-size: 14px; }
    .day-chip span { font-size: 11.5px; opacity: .75; }

    .shifts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .panel-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .panel-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--text-primary); }
    .panel-sub { font-size: 12px; color: var(--text-muted); }
    [hidden] { display: none !important; }
    .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
    .lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--border-strong); background: var(--surface); }
    .lg.on { background: var(--accent); border-color: var(--accent); }
    .lg.meeting { background: var(--navy-100); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
    .lg.block { background: var(--warning-bg); border-color: var(--warning-border); }

    /* Mỗi ô = 1 khung 30 phút. Ô trống và ô của mình (admin: mọi ô) tick được; tick xong bấm Đăng ký / Hủy ở thanh dưới. */
    .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 12px; }
    .cell { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; min-height: 60px; padding: 8px 10px; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
    .c-time { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text-secondary); max-width: calc(100% - 22px); }
    .c-who, .c-note { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
    .c-note { font-size: 11.5px; color: var(--text-secondary); }
    .c-box { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border: 1.5px solid var(--border-strong); border-radius: 5px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--on-accent); font-size: 13px; font-weight: 800; line-height: 1; }
    .cell.free .c-who { color: var(--success); font-weight: 600; }
    .cell.free:hover { border-color: var(--success-border); background: var(--success-bg); }
    .cell.meeting { background: var(--navy-100); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
    .cell.meeting .c-who { font-weight: 700; color: var(--info); }
    .cell.block { background: var(--warning-bg); border-color: var(--warning-border); }
    .cell.block .c-who { font-weight: 700; color: var(--warning); }
    .cell.mine { border-color: var(--accent); }
    .cell.locked { cursor: default; }
    .cell.past { opacity: .45; cursor: default; }
    .cell.now { border-left: 4px solid var(--accent); }
    .cell.on .c-box::after { content: "✓"; }
    .cell.on.book { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: inset 0 0 0 2px var(--accent); }
    .cell.on.book .c-box { background: var(--accent); border-color: var(--accent); }
    .cell.on.book .c-who { color: var(--accent); }
    .cell.on.cancel { box-shadow: inset 0 0 0 2px var(--danger); }
    .cell.on.cancel .c-box { background: var(--danger); border-color: var(--danger); }
    .cell.on.cancel .c-who { text-decoration: line-through; }

    .sel-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); z-index: 60; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--surface-subtle); color: var(--text-primary); border: 1px solid var(--border-strong); }
    .sel-info { flex: 1; min-width: 180px; display: flex; flex-direction: column; font-size: 12.5px; }
    .sel-info b { font-size: 14px; }
    .sel-info span { color: var(--text-secondary); overflow-wrap: anywhere; }
    .sel-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        main { padding-bottom: calc(40px + var(--bar-h, 0px)); }

    dialog { border: 1px solid var(--border-strong); border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--text-primary); }
    dialog::backdrop { background: rgba(3, 5, 8, .72); }
    .dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .dlg h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--text-primary); }
    .dlg-slot { font-weight: 700; background: var(--navy-100); border-radius: 8px; padding: 8px 12px; white-space: pre-line; }
    .dlg label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .dlg input { font: 14px var(--font-sans); padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-subtle); color: var(--text-primary); }
    .dlg input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .dlg-who { font-size: 13px; color: var(--text-secondary); }
    .dlg-err { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 1em; }
    .dlg-foot { display: flex; gap: 8px; flex-wrap: wrap; }
    .toast { border: 1px solid var(--border-strong); position: fixed; left: 50%; bottom: calc(20px + var(--bar-h, 0px)); transform: translateX(-50%); background: var(--surface-subtle); color: var(--text-primary); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 100; display: none; }

    @media (max-width: 860px) {
      .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
      .shifts { grid-template-columns: 1fr; }
      .cells { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; padding: 10px; }
      .topbar { position: static; } /* thanh trên cao ~145px trên điện thoại: không dính để nhường chỗ cho các ô */
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">📅</div>
        <div>
          <div class="brand-title">HẸN LỊCH BOD</div>
          <div class="brand-sub">Ca Sáng 08:00–17:30 · Ca Tối 18:00–03:30 · Mỗi ô 30 phút</div>
        </div>
      </div>
      <!-- Tên người dùng + Đăng xuất nằm ở thanh điều hướng chung (Worker chèn vào đầu trang); giữ #meName cho script. -->
      <div class="top-actions" hidden>
        <span id="meName" class="brand-sub"></span>
      </div>
    </div>
  </header>

  <main>
    <div id="errBanner" class="err-banner" hidden></div>
    <section class="now-card">
      <div id="nowDot" class="now-dot"></div>
      <div class="now-main">
        <div id="nowLabel" class="now-label">Đang tải…</div>
        <div id="nowText" class="now-text">&nbsp;</div>
      </div>
      <button id="nextBtn" class="btn btn-primary" type="button" hidden></button>
    </section>
    <nav id="days" class="days" aria-label="Chọn ngày"></nav>
    <div class="legend">
      <span><i class="lg"></i>Trống — bấm để tick</span>
      <span><i class="lg on"></i>Đang chọn</span>
      <span><i class="lg meeting"></i>Đã có lịch</span>
      <span><i class="lg block"></i>BOD bận</span>
      <span>Tick nhiều ô rồi bấm <b>Đăng ký</b> · Tick ô của mình để hủy</span>
    </div>
    <div class="shifts">
      <section class="panel">
        <div class="panel-head"><h2 class="panel-title">☀️ Ca Sáng</h2><span id="daySub" class="panel-sub"></span></div>
        <div id="daySlots" class="cells"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2 class="panel-title">🌙 Ca Tối</h2><span id="nightSub" class="panel-sub"></span></div>
        <div id="nightSlots" class="cells"></div>
      </section>
    </div>
  </main>

  <div id="selBar" class="sel-bar" hidden>
    <div class="sel-info"><b id="selCount"></b><span id="selRanges"></span></div>
    <div class="sel-actions">
      <button id="selClear" class="btn" type="button">Bỏ chọn</button>
      <button id="selCancel" class="btn btn-danger" type="button" hidden></button>
      <button id="selBook" class="btn btn-primary" type="button" hidden></button>
    </div>
  </div>

  <dialog id="dlg">
    <form id="dlgForm" class="dlg">
      <h3 id="dlgTitle">Hẹn lịch BOD</h3>
      <div id="dlgSlot" class="dlg-slot"></div>
      <div class="dlg-who">Người đặt: <b id="dlgWho"></b></div>
      <label>Nội dung / dòng tiền cần báo cáo<input id="fNote" maxlength="300" placeholder="VD: Dòng tiền nợ khó đòi – xin chốt phương án" /></label>
      <div id="dlgErr" class="dlg-err"></div>
      <div class="dlg-foot">
        <button id="fBlock" class="btn" type="button" title="Dành cho thư ký: chặn khung giờ BOD có việc riêng">⛔ BOD bận</button>
        <span style="flex:1"></span>
        <button id="fClose" class="btn" type="button">Đóng</button>
        <button id="fSubmit" class="btn btn-primary" type="submit">Đăng ký</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast"></div>

  <script>
  (() => {
    "use strict";
    // Phút trong ngày của giờ bắt đầu mỗi khung 30'. Ca Tối vượt 24:00 = rạng sáng hôm sau.
    const DAY = [], NIGHT = [];
    for (let m = 480; m < 1050; m += 30) DAY.push(m);         // 08:00 … 17:00
    for (let m = 1080; m < 1440 + 210; m += 30) NIGHT.push(m); // 18:00 … 03:00
    const WD = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    const $ = (id) => document.getElementById(id);

    let bookings = {};
    let me = null; // người đang đăng nhập, server trả kèm danh sách lịch
    let selected = null;         // ngày (của ca) đang xem
    const sel = new Map();       // các ô đang tick: slot -> "book" (đăng ký) | "cancel" (hủy)

    const pad = (n) => String(n).padStart(2, "0");
    const nowVN = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 16);
    const addDays = (d, n) => new Date(Date.parse(d + "T00:00Z") + n * 864e5).toISOString().slice(0, 10);
    const addMin = (s, n) => new Date(Date.parse(s + ":00Z") + n * 6e4).toISOString().slice(0, 16);
    const slotKey = (date, min) => `${min >= 1440 ? addDays(date, 1) : date}T${pad(Math.floor((min % 1440) / 60))}:${pad(min % 60)}`;
    const isPast = (s) => addMin(s, 30) <= nowVN();
    const hm = (s) => s.slice(11, 16);
    const dm = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
    const wd = (d) => WD[new Date(d + "T00:00Z").getUTCDay()];
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    // Đang ở Ca Tối sau nửa đêm (trước 03:30) thì vẫn tính là ngày làm việc hôm trước.
    const currentShiftDate = () => { const n = nowVN(); return hm(n) < "03:30" ? addDays(n.slice(0, 10), -1) : n.slice(0, 10); };
    const shiftOf = (date) => ({ day: DAY.map((m) => slotKey(date, m)), night: NIGHT.map((m) => slotKey(date, m)) });
    const dayLabel = (d) => (d === nowVN().slice(0, 10) ? "Hôm nay" : d === addDays(nowVN().slice(0, 10), 1) ? "Ngày mai" : `${wd(d)} ${dm(d)}`);
    const canCancel = (b) => me && (me.role === "admin" || b.username === me.username);

    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.style.display = "block";
      clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 2600);
    }

    async function api(method, query, body) {
      const res = await fetch("/api/bookings" + query, {
        method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401) { location.reload(); throw new Error("Phiên đăng nhập đã hết hạn."); }
      const data = await res.json().catch(() => ({}));
      if (res.status === 403 && data.mustChange) { location.href = "/doi-mat-khau"; throw new Error(data.error); }
      if (!res.ok) { const e = new Error(data.error || `Lỗi ${res.status}`); e.status = res.status; e.taken = data.taken; throw e; }
      return data;
    }

    async function load() {
      const base = currentShiftDate();
      try {
        const data = await api("GET", `?from=${addDays(base, -1)}T00:00&to=${addDays(base, 8)}T00:00`);
        bookings = Object.fromEntries(data.bookings.map((b) => [b.slot, b]));
        me = data.me;
        $("meName").textContent = `👤 ${me.fullName}`;
        $("errBanner").hidden = true;
      } catch (e) {
        $("errBanner").textContent = "Không tải được lịch: " + e.message; $("errBanner").hidden = false;
      }
      render();
    }

    function render() {
      const base = currentShiftDate();
      const dates = Array.from({ length: 7 }, (_, i) => addDays(base, i));
      if (!dates.includes(selected)) selected = base;
      prune();

      $("days").innerHTML = dates.map((d) => {
        const all = shiftOf(d).day.concat(shiftOf(d).night);
        const n = all.filter((s) => bookings[s]?.kind === "meeting").length;
        const k = all.filter((s) => sel.has(s)).length;
        return `<button class="day-chip${d === selected ? " active" : ""}" data-date="${d}" type="button"><b>${dayLabel(d)}</b><span>${wd(d)} ${dm(d)} · ${n} lịch${k ? ` · ✓${k} chọn` : ""}</span></button>`;
      }).join("");

      const { day, night } = shiftOf(selected);
      $("daySub").textContent = `${wd(selected)} ${dm(selected)} · 08:00–17:30`;
      $("nightSub").textContent = `18:00 ${dm(selected)} → 03:30 ${dm(addDays(selected, 1))}`;
      $("daySlots").innerHTML = day.map(cell).join("");
      $("nightSlots").innerHTML = night.map(cell).join("");
      renderNow(dates);
      renderBar();
    }

    // Lịch vừa đổi (người khác đặt/hủy) hoặc khung đã qua: bỏ tick những ô không còn hợp lệ.
    function prune() {
      let lost = 0;
      for (const [s, act] of sel) {
        const b = bookings[s];
        if (!isPast(s) && (act === "book" ? !b : b && canCancel(b))) continue;
        sel.delete(s);
        if (act === "book" && b && b.username !== me?.username) lost++;
      }
      if (lost) toast(`${lost} ô bạn đang chọn vừa có người đặt — đã bỏ chọn`);
    }

    const tickable = (s) => !isPast(s) && (!bookings[s] || canCancel(bookings[s]));

    function cell(s) {
      const b = bookings[s], past = isPast(s), act = sel.get(s), tick = tickable(s);
      const cls = ["cell", b ? b.kind : "free", b && me && b.username === me.username ? "mine" : "",
        past ? "past" : "", !past && s <= nowVN() ? "now" : "", act ? "on " + act : "", tick ? "" : "locked"];
      const who = !b ? (past ? "—" : act ? "Đã chọn" : "Trống") : b.kind === "block" ? "⛔ BOD bận" : esc(b.name);
      const note = b?.note ? `<span class="c-note">${esc(b.note)}</span>` : "";
      const info = b ? ` · ${b.kind === "block" ? `BOD bận (${b.name})` : b.name}${b.note ? " · " + b.note : ""}` : "";
      return `<button type="button" class="${cls.filter(Boolean).join(" ")}" data-slot="${s}" ${tick ? `aria-pressed="${!!act}"` : `aria-disabled="true"`} title="${esc(hm(s) + "–" + hm(addMin(s, 30)) + info)}">`
        + `<span class="c-time mono">${hm(s)}</span>${tick ? `<span class="c-box"></span>` : ""}<span class="c-who">${who}</span>${note}</button>`;
    }

    function toggle(s) {
      const b = bookings[s];
      if (isPast(s)) return;
      if (!tickable(s)) { toast(`${hm(s)} · ${b.kind === "block" ? "BOD bận" : b.name}${b.note ? " · " + b.note : ""}`); return; }
      if (sel.has(s)) sel.delete(s); else sel.set(s, b ? "cancel" : "book");
      render();
      document.querySelector(`[data-slot="${s}"]`)?.focus({ preventScroll: true });
    }

    const picked = (act) => [...sel].filter(([, a]) => a === act).map(([s]) => s).sort();

    // Gộp các ô liền nhau thành khoảng: 09:00, 09:30, 14:00 → "Hôm nay 09:00–10:00", "Hôm nay 14:00–14:30"
    function ranges(slots) {
      const out = [];
      for (const s of [...slots].sort()) {
        const last = out[out.length - 1];
        if (last && last.end === s) last.end = addMin(s, 30);
        else out.push({ start: s, end: addMin(s, 30) });
      }
      return out.map((r) => `${dayLabel(r.start.slice(0, 10))} ${hm(r.start)}–${hm(r.end)}`);
    }

    function renderBar() {
      const book = picked("book"), cancel = picked("cancel");
      $("selBar").hidden = !sel.size;
      if (sel.size) {
        $("selCount").textContent = `Đã chọn ${sel.size} ô · ${sel.size * 30} phút`;
        $("selRanges").textContent = ranges([...sel.keys()]).join(", ");
        $("selBook").hidden = !book.length; $("selBook").textContent = `Đăng ký ${book.length} ô`;
        $("selCancel").hidden = !cancel.length; $("selCancel").textContent = `Hủy ${cancel.length} ô`;
      }
      document.documentElement.style.setProperty("--bar-h", sel.size ? $("selBar").offsetHeight + 16 + "px" : "0px");
    }

    function renderNow(dates) {
      const n = nowVN();
      const cur = `${n.slice(0, 14)}${n.slice(14, 16) < "30" ? "00" : "30"}`;
      const all = dates.flatMap((d) => [...shiftOf(d).day, ...shiftOf(d).night]);
      const inShift = shiftOf(currentShiftDate()).day.concat(shiftOf(currentShiftDate()).night).includes(cur);
      const b = bookings[cur];
      const shiftName = !inShift ? "Ngoài giờ làm việc" : hm(cur) >= "08:00" && hm(cur) < "17:30" ? "Ca Sáng" : "Ca Tối";
      $("nowLabel").textContent = `Bây giờ · ${hm(n)} · ${shiftName}`;

      let end = addMin(cur, 30);
      while (b && bookings[end] && bookings[end].kind === b.kind && bookings[end].name === b.name) end = addMin(end, 30);
      if (!inShift) { $("nowDot").className = "now-dot"; $("nowText").textContent = "BOD đang ngoài ca làm việc"; }
      else if (!b) { $("nowDot").className = "now-dot free"; $("nowText").textContent = "BOD đang TRỐNG lịch"; }
      else if (b.kind === "block") { $("nowDot").className = "now-dot busy"; $("nowText").innerHTML = `BOD đang BẬN${b.note ? " · " + esc(b.note) : ""} (đến ${hm(end)})`; }
      else { $("nowDot").className = "now-dot busy"; $("nowText").innerHTML = `BOD đang họp với <b>${esc(b.name)}</b>${b.note ? " · " + esc(b.note) : ""} (đến ${hm(end)})`; }

      const next = all.find((s) => !isPast(s) && !bookings[s]);
      const btn = $("nextBtn");
      btn.hidden = !next;
      if (next) {
        const d = DAY.includes(Number(hm(next).slice(0, 2)) * 60 + Number(hm(next).slice(3))) ? next.slice(0, 10) : dates.find((x) => shiftOf(x).night.includes(next));
        btn.textContent = `Đặt lượt trống gần nhất: ${dayLabel(d)} ${hm(next)}`;
        btn.dataset.book = next;
      }
    }

    function fillDialog() {
      const slots = picked("book");
      $("dlgTitle").textContent = `Hẹn lịch BOD: ${slots.length} ô (${slots.length * 30} phút)`;
      $("dlgSlot").textContent = ranges(slots).join("\n");
      $("fSubmit").textContent = `Đăng ký ${slots.length} ô`;
    }

    function openDialog() {
      if (!picked("book").length) return;
      fillDialog();
      $("dlgWho").textContent = me ? `${me.fullName} (${me.username})` : "";
      $("fNote").value = "";
      $("dlgErr").textContent = "";
      $("dlg").showModal();
      $("fNote").focus();
    }

    // Đăng ký mọi ô đang tick trong một lần: server nhận tất cả hoặc không ô nào.
    async function book(kind) {
      const slots = picked("book");
      if (!slots.length) return;
      try {
        await api("POST", "", { slots, kind, note: $("fNote").value.trim() });
        slots.forEach((s) => sel.delete(s));
        $("dlg").close();
        toast(`${kind === "block" ? "Đã chặn" : "Đã đăng ký"} ${slots.length} ô: ${ranges(slots).join(", ")}`);
      } catch (e) {
        if (e.status !== 409) { $("dlgErr").textContent = e.message; return; }
        const taken = e.taken || [];
        taken.forEach((s) => sel.delete(s));
        const msg = taken.length ? `Ô ${ranges(taken).join(", ")} vừa có người đặt — đã bỏ chọn.` : e.message;
        if (picked("book").length) { fillDialog(); $("dlgErr").textContent = msg + " Bấm Đăng ký để đặt các ô còn lại."; }
        else { $("dlg").close(); toast(msg); }
      }
      load();
    }

    async function cancelSelected() {
      const slots = picked("cancel");
      if (!slots.length || !confirm(`Hủy ${slots.length} ô: ${ranges(slots).join(", ")}?`)) return;
      try {
        await api("DELETE", "?" + slots.map((s) => "slot=" + encodeURIComponent(s)).join("&"));
        slots.forEach((s) => sel.delete(s));
        toast(`Đã hủy ${slots.length} ô`);
      } catch (e) { toast(e.message); }
      load();
    }

    document.addEventListener("click", (e) => {
      const day = e.target.closest("[data-date]");
      if (day) { selected = day.dataset.date; render(); return; }
      const c = e.target.closest("[data-slot]");
      if (c) toggle(c.dataset.slot);
    });
    // Nút "Đặt lượt trống gần nhất": tick ô đó và mở luôn hộp đăng ký.
    $("nextBtn").onclick = () => {
      const s = $("nextBtn").dataset.book;
      selected = hm(s) < "03:30" ? addDays(s.slice(0, 10), -1) : s.slice(0, 10);
      sel.set(s, "book"); render(); openDialog();
    };
    $("selBook").onclick = openDialog;
    $("selCancel").onclick = cancelSelected;
    $("selClear").onclick = () => { sel.clear(); render(); };
    window.addEventListener("resize", renderBar);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sel.size && !$("dlg").open) { sel.clear(); render(); } });
    $("dlgForm").addEventListener("submit", (e) => { e.preventDefault(); book("meeting"); });
    $("fBlock").onclick = () => book("block");
    $("fClose").onclick = () => $("dlg").close();

    // Thời gian thực: server đẩy gợi ý "lịch vừa thay đổi" qua WebSocket, trang tự tải lại.
    // Mất kết nối thì thử lại (chờ tăng dần tới 30 giây) và tạm hỏi server định kỳ 30 giây.
    let ws = null, wsDelay = 1000;
    const live = () => ws && ws.readyState === WebSocket.OPEN;
    function connect() {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/live/ws");
      ws.onopen = () => { wsDelay = 1000; load(); };
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; } // "pong"
        if (m.type === "change" && m.scope === "bookings") load();
      };
      ws.onclose = () => { ws = null; setTimeout(connect, wsDelay); wsDelay = Math.min(wsDelay * 2, 30000); };
    }

    load();
    connect();
    setInterval(() => { if (live()) ws.send("ping"); }, 30000);
    // Khi có WebSocket chỉ vẽ lại (khung "đã qua", "bây giờ"); khi mất kết nối thì tải lại từ server.
    setInterval(() => { if (!document.hidden) (live() ? render() : load()); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  })();
  </script>
</body>
</html>
