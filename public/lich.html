<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Chủ tịch – Đặt lịch họp | WAR ROOM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <style>
    :root {
      --bg: #f4f6f9; --surface: #fff; --surface-subtle: #f8fafc; --surface-hover: #f1f5f9;
      --border: #e2e8f0; --border-strong: #cbd5e1;
      --navy-950: #0c1f3a; --navy-800: #17365d; --navy-700: #1e477a; --navy-100: #e8f0fa;
      --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #64748b; --accent: #1d4ed8;
      --success: #0f766e; --success-bg: #ecfdf5; --success-border: #a7f3d0;
      --warning: #b45309; --warning-bg: #fffbeb; --warning-border: #fde68a;
      --danger: #dc2626; --danger-bg: #fef2f2; --danger-border: #fecaca;
      --font-sans: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.5; color: var(--text-primary); background: var(--bg); }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .topbar { background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 100%); color: #fff; position: sticky; top: 0; z-index: 40; box-shadow: 0 4px 16px rgba(12,31,58,.2); }
    .topbar-inner, main { max-width: 1240px; margin: 0 auto; padding: 12px 20px; }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 9px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .brand-title { font-weight: 800; font-size: 16px; letter-spacing: .02em; }
    .brand-sub { font-size: 12px; color: rgba(255,255,255,.72); }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font: 600 12.5px var(--font-sans); cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); text-decoration: none; white-space: nowrap; }
    .btn:hover { background: var(--surface-hover); }
    .btn-primary { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
    .btn-primary:hover { background: var(--navy-700); }
    .btn-ghost-top { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); color: #fff; }
    .btn-ghost-top:hover { background: rgba(255,255,255,.18); }
    .btn-danger { color: var(--danger); border-color: var(--danger-border); }
    .btn-danger:hover { background: var(--danger-bg); }
    main { padding-top: 18px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 16px; }

    .now-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .now-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--text-muted); }
    .now-dot.free { background: #10b981; box-shadow: 0 0 0 5px rgba(16,185,129,.18); }
    .now-dot.busy { background: var(--danger); box-shadow: 0 0 0 5px rgba(220,38,38,.15); }
    .now-main { flex: 1; min-width: 240px; }
    .now-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .now-text { font-size: 17px; font-weight: 600; }
    .err-banner { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); border-radius: 10px; padding: 10px 14px; font-weight: 600; }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .day-chip { flex: none; min-width: 92px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-family: inherit; color: var(--text-primary); }
    .day-chip:hover { border-color: var(--border-strong); }
    .day-chip.active { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
    .day-chip b { display: block; font-size: 14px; }
    .day-chip span { font-size: 11.5px; opacity: .75; }

    .shifts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .panel-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .panel-title { margin: 0; font-size: 15px; color: var(--navy-800); }
    .panel-sub { font-size: 12px; color: var(--text-muted); }
    .slot { display: grid; grid-template-columns: 104px 1fr auto; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--border); min-height: 46px; }
    .slot:last-child { border-bottom: 0; }
    .slot-time { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .slot-body { min-width: 0; overflow-wrap: anywhere; }
    .slot.free { cursor: pointer; }
    .slot.free:hover { background: var(--success-bg); }
    .slot.free .slot-body { color: var(--success); font-weight: 600; }
    .slot.meeting { background: var(--navy-100); }
    .slot.block { background: var(--warning-bg); }
    .slot.block .slot-body { color: var(--warning); }
    .slot.past { opacity: .45; }
    .slot.now { box-shadow: inset 4px 0 0 var(--accent); }
    .who { font-weight: 700; }
    .note { color: var(--text-secondary); }

    dialog { border: 0; border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(12,31,58,.3); }
    dialog::backdrop { background: rgba(12,31,58,.45); }
    .dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .dlg h3 { margin: 0; font-size: 16px; color: var(--navy-800); }
    .dlg-slot { font-weight: 700; background: var(--navy-100); border-radius: 8px; padding: 8px 12px; }
    .dlg label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .dlg input { font: 14px var(--font-sans); padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; }
    .dlg input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .dlg-who { font-size: 13px; color: var(--text-secondary); }
    .dlg-err { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 1em; }
    .dlg-foot { display: flex; gap: 8px; flex-wrap: wrap; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy-950); color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 100; display: none; }

    @media (max-width: 860px) {
      .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
      .shifts { grid-template-columns: 1fr; }
      .slot { grid-template-columns: 88px 1fr auto; padding: 7px 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">📅</div>
        <div>
          <div class="brand-title">LỊCH CHỦ TỊCH — ĐẶT LỊCH HỌP</div>
          <div class="brand-sub">Ca Sáng 08:00–17:30 · Ca Tối 18:00–03:30 · Mỗi lượt 30 phút</div>
        </div>
      </div>
      <div class="top-actions">
        <span id="meName" class="brand-sub"></span>
        <a class="btn btn-ghost-top" href="/">← Về Dashboard</a>
        <a class="btn btn-ghost-top" href="/logout">Đăng xuất</a>
      </div>
    </div>
  </header>

  <main>
    <div id="errBanner" class="err-banner" hidden></div>
    <section class="now-card">
      <div id="nowDot" class="now-dot"></div>
      <div class="now-main">
        <div id="nowLabel" class="now-label">Đang tải…</div>
        <div id="nowText" class="now-text">&nbsp;</div>
      </div>
      <button id="nextBtn" class="btn btn-primary" type="button" hidden></button>
    </section>
    <nav id="days" class="days" aria-label="Chọn ngày"></nav>
    <div class="shifts">
      <section class="panel">
        <div class="panel-head"><h2 class="panel-title">☀️ Ca Sáng</h2><span id="daySub" class="panel-sub"></span></div>
        <div id="daySlots"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2 class="panel-title">🌙 Ca Tối</h2><span id="nightSub" class="panel-sub"></span></div>
        <div id="nightSlots"></div>
      </section>
    </div>
  </main>

  <dialog id="dlg">
    <form id="dlgForm" class="dlg">
      <h3>Đặt lịch họp với Chủ tịch</h3>
      <div id="dlgSlot" class="dlg-slot"></div>
      <div class="dlg-who">Người đặt: <b id="dlgWho"></b></div>
      <label>Nội dung / dòng tiền cần báo cáo<input id="fNote" maxlength="300" placeholder="VD: Dòng tiền 3 – xin chốt phương án" /></label>
      <div id="dlgErr" class="dlg-err"></div>
      <div class="dlg-foot">
        <button id="fBlock" class="btn" type="button" title="Dành cho thư ký: chặn khung giờ Chủ tịch có việc riêng">⛔ Chủ tịch bận</button>
        <span style="flex:1"></span>
        <button id="fClose" class="btn" type="button">Đóng</button>
        <button class="btn btn-primary" type="submit">Đặt lịch</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast"></div>

  <script>
  (() => {
    "use strict";
    // Phút trong ngày của giờ bắt đầu mỗi khung 30'. Ca Tối vượt 24:00 = rạng sáng hôm sau.
    const DAY = [], NIGHT = [];
    for (let m = 480; m < 1050; m += 30) DAY.push(m);         // 08:00 … 17:00
    for (let m = 1080; m < 1440 + 210; m += 30) NIGHT.push(m); // 18:00 … 03:00
    const WD = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    const $ = (id) => document.getElementById(id);

    let bookings = {};
    let me = null; // người đang đăng nhập, server trả kèm danh sách lịch
    let selected = null;
    let dlgSlotKey = null;

    const pad = (n) => String(n).padStart(2, "0");
    const nowVN = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 16);
    const addDays = (d, n) => new Date(Date.parse(d + "T00:00Z") + n * 864e5).toISOString().slice(0, 10);
    const addMin = (s, n) => new Date(Date.parse(s + ":00Z") + n * 6e4).toISOString().slice(0, 16);
    const slotKey = (date, min) => `${min >= 1440 ? addDays(date, 1) : date}T${pad(Math.floor((min % 1440) / 60))}:${pad(min % 60)}`;
    const isPast = (s) => addMin(s, 30) <= nowVN();
    const hm = (s) => s.slice(11, 16);
    const dm = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
    const wd = (d) => WD[new Date(d + "T00:00Z").getUTCDay()];
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    // Đang ở Ca Tối sau nửa đêm (trước 03:30) thì vẫn tính là ngày làm việc hôm trước.
    const currentShiftDate = () => { const n = nowVN(); return hm(n) < "03:30" ? addDays(n.slice(0, 10), -1) : n.slice(0, 10); };
    const shiftOf = (date) => ({ day: DAY.map((m) => slotKey(date, m)), night: NIGHT.map((m) => slotKey(date, m)) });
    const dayLabel = (d) => (d === nowVN().slice(0, 10) ? "Hôm nay" : d === addDays(nowVN().slice(0, 10), 1) ? "Ngày mai" : `${wd(d)} ${dm(d)}`);
    const canCancel = (b) => me && (me.role === "admin" || b.username === me.username);

    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.style.display = "block";
      clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 2600);
    }

    async function api(method, query, body) {
      const res = await fetch("/api/bookings" + query, {
        method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401) { location.reload(); throw new Error("Phiên đăng nhập đã hết hạn."); }
      const data = await res.json().catch(() => ({}));
      if (res.status === 403 && data.mustChange) { location.href = "/doi-mat-khau"; throw new Error(data.error); }
      if (!res.ok) { const e = new Error(data.error || `Lỗi ${res.status}`); e.status = res.status; throw e; }
      return data;
    }

    async function load() {
      const base = currentShiftDate();
      try {
        const data = await api("GET", `?from=${addDays(base, -1)}T00:00&to=${addDays(base, 8)}T00:00`);
        bookings = Object.fromEntries(data.bookings.map((b) => [b.slot, b]));
        me = data.me;
        $("meName").textContent = `👤 ${me.fullName}`;
        $("errBanner").hidden = true;
      } catch (e) {
        $("errBanner").textContent = "Không tải được lịch: " + e.message; $("errBanner").hidden = false;
      }
      render();
    }

    function render() {
      const base = currentShiftDate();
      const dates = Array.from({ length: 7 }, (_, i) => addDays(base, i));
      if (!dates.includes(selected)) selected = base;

      $("days").innerHTML = dates.map((d) => {
        const n = shiftOf(d).day.concat(shiftOf(d).night).filter((s) => bookings[s]?.kind === "meeting").length;
        return `<button class="day-chip${d === selected ? " active" : ""}" data-date="${d}" type="button"><b>${dayLabel(d)}</b><span>${wd(d)} ${dm(d)} · ${n} lịch</span></button>`;
      }).join("");

      const { day, night } = shiftOf(selected);
      $("daySub").textContent = `${wd(selected)} ${dm(selected)} · 08:00–17:30`;
      $("nightSub").textContent = `18:00 ${dm(selected)} → 03:30 ${dm(addDays(selected, 1))}`;
      $("daySlots").innerHTML = day.map(slotRow).join("");
      $("nightSlots").innerHTML = night.map(slotRow).join("");
      renderNow(dates);
    }

    function slotRow(s) {
      const b = bookings[s], past = isPast(s);
      const cur = !past && s <= nowVN();
      const cls = ["slot", b ? b.kind : "free", past ? "past" : "", cur ? "now" : ""].join(" ");
      let body, act = "";
      if (!b) {
        body = past ? "—" : "Trống";
        if (!past) act = `<button class="btn" type="button" data-book="${s}">Đặt</button>`;
      } else if (b.kind === "block") {
        body = `⛔ <span class="who">Chủ tịch bận</span>${b.note ? ` · <span class="note">${esc(b.note)}</span>` : ""} <span class="note">(${esc(b.name)})</span>`;
        if (!past && canCancel(b)) act = `<button class="btn btn-danger" type="button" data-cancel="${s}">Bỏ chặn</button>`;
      } else {
        body = `<span class="who">${esc(b.name)}</span>${b.note ? ` · <span class="note">${esc(b.note)}</span>` : ""}`;
        if (!past && canCancel(b)) act = `<button class="btn btn-danger" type="button" data-cancel="${s}">Hủy</button>`;
      }
      return `<div class="${cls.trim()}"${!b && !past ? ` data-book="${s}"` : ""}><div class="slot-time mono">${hm(s)}–${hm(addMin(s, 30))}</div><div class="slot-body">${body}</div><div>${act}</div></div>`;
    }

    function renderNow(dates) {
      const n = nowVN();
      const cur = `${n.slice(0, 14)}${n.slice(14, 16) < "30" ? "00" : "30"}`;
      const all = dates.flatMap((d) => [...shiftOf(d).day, ...shiftOf(d).night]);
      const inShift = shiftOf(currentShiftDate()).day.concat(shiftOf(currentShiftDate()).night).includes(cur);
      const b = bookings[cur];
      const shiftName = !inShift ? "Ngoài giờ làm việc" : hm(cur) >= "08:00" && hm(cur) < "17:30" ? "Ca Sáng" : "Ca Tối";
      $("nowLabel").textContent = `Bây giờ · ${hm(n)} · ${shiftName}`;

      let end = addMin(cur, 30);
      while (b && bookings[end] && bookings[end].kind === b.kind && bookings[end].name === b.name) end = addMin(end, 30);
      if (!inShift) { $("nowDot").className = "now-dot"; $("nowText").textContent = "Chủ tịch đang ngoài ca làm việc"; }
      else if (!b) { $("nowDot").className = "now-dot free"; $("nowText").textContent = "Chủ tịch đang TRỐNG lịch"; }
      else if (b.kind === "block") { $("nowDot").className = "now-dot busy"; $("nowText").innerHTML = `Chủ tịch đang BẬN${b.note ? " · " + esc(b.note) : ""} (đến ${hm(end)})`; }
      else { $("nowDot").className = "now-dot busy"; $("nowText").innerHTML = `Chủ tịch đang họp với <b>${esc(b.name)}</b>${b.note ? " · " + esc(b.note) : ""} (đến ${hm(end)})`; }

      const next = all.find((s) => !isPast(s) && !bookings[s]);
      const btn = $("nextBtn");
      btn.hidden = !next;
      if (next) {
        const d = DAY.includes(Number(hm(next).slice(0, 2)) * 60 + Number(hm(next).slice(3))) ? next.slice(0, 10) : dates.find((x) => shiftOf(x).night.includes(next));
        btn.textContent = `Đặt lượt trống gần nhất: ${dayLabel(d)} ${hm(next)}`;
        btn.dataset.book = next;
      }
    }

    function openDialog(s) {
      dlgSlotKey = s;
      const date = dates7().find((d) => shiftOf(d).day.includes(s) || shiftOf(d).night.includes(s));
      const shift = shiftOf(date).day.includes(s) ? "Ca Sáng" : "Ca Tối";
      $("dlgSlot").textContent = `${dayLabel(date)} (${wd(s.slice(0, 10))} ${dm(s.slice(0, 10))}) · ${hm(s)}–${hm(addMin(s, 30))} · ${shift}`;
      $("dlgWho").textContent = me ? `${me.fullName} (${me.username})` : "";
      $("fNote").value = "";
      $("dlgErr").textContent = "";
      $("dlg").showModal();
      $("fNote").focus();
    }
    const dates7 = () => Array.from({ length: 7 }, (_, i) => addDays(currentShiftDate(), i));

    async function book(kind) {
      try {
        await api("POST", "", { slot: dlgSlotKey, kind, note: $("fNote").value.trim() });
        $("dlg").close();
        toast(kind === "block" ? "Đã chặn khung giờ" : `Đã đặt lịch ${hm(dlgSlotKey)}`);
      } catch (e) {
        $("dlgErr").textContent = e.message;
        if (e.status !== 409) return;
      }
      load();
    }

    async function cancel(s) {
      const b = bookings[s];
      if (!b || !confirm(`${b.kind === "block" ? "Bỏ chặn" : "Hủy lịch của " + b.name} lúc ${hm(s)} ngày ${dm(s.slice(0, 10))}?`)) return;
      try { await api("DELETE", `?slot=${encodeURIComponent(s)}`); toast("Đã hủy"); } catch (e) { toast(e.message); }
      load();
    }

    document.addEventListener("click", (e) => {
      const day = e.target.closest("[data-date]");
      if (day) { selected = day.dataset.date; render(); return; }
      const c = e.target.closest("[data-cancel]");
      if (c) { cancel(c.dataset.cancel); return; }
      const bk = e.target.closest("[data-book]");
      if (bk) openDialog(bk.dataset.book);
    });
    $("dlgForm").addEventListener("submit", (e) => { e.preventDefault(); book("meeting"); });
    $("fBlock").onclick = () => book("block");
    $("fClose").onclick = () => $("dlg").close();

    // Thời gian thực: server đẩy gợi ý "lịch vừa thay đổi" qua WebSocket, trang tự tải lại.
    // Mất kết nối thì thử lại (chờ tăng dần tới 30 giây) và tạm hỏi server định kỳ 30 giây.
    let ws = null, wsDelay = 1000;
    const live = () => ws && ws.readyState === WebSocket.OPEN;
    function connect() {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/live/ws");
      ws.onopen = () => { wsDelay = 1000; load(); };
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; } // "pong"
        if (m.type === "change" && m.scope === "bookings") load();
      };
      ws.onclose = () => { ws = null; setTimeout(connect, wsDelay); wsDelay = Math.min(wsDelay * 2, 30000); };
    }

    load();
    connect();
    setInterval(() => { if (live()) ws.send("ping"); }, 30000);
    // Khi có WebSocket chỉ vẽ lại (khung "đã qua", "bây giờ"); khi mất kết nối thì tải lại từ server.
    setInterval(() => { if (!document.hidden) (live() ? render() : load()); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  })();
  </script>
</body>
</html>
